<button class="buttons" id="1" >Platformer</button>

<script>

let buttons = document.querySelectorAll(".buttons")

let links = [
  "https://svelegames.sverre-tresselt.workers.dev/platformer/"
]
  
buttons.forEach(button => {
    button.addEventListener("click", () => {
        let id = Number(button.id)
        window.location.href = links[id - 1]
    })
})
  
</script>
